            }
            var toggle = event.target.closest('[data-password-toggle]');
            if (toggle) { var input = document.getElementById(toggle.dataset.passwordToggle); input.type = input.type === 'password' ? 'text' : 'password'; toggle.textContent = input.type === 'password' ? 'Hiện' : 'Ẩn'; toggle.setAttribute('aria-label', input.type === 'password' ? 'Hiện mật khẩu' : 'Ẩn mật khẩu'); return; }
            if (event.target.id === 'staffCancelOtp') { document.getElementById('staffOtpDialog').close(); return; }
            if (event.target.id === 'staffResendOtp') { var codeResult = RH.resendOwnPasswordCode(staffPasswordChallengeId); if (codeResult.ok) presentDemoPasswordCode(codeResult); else document.getElementById('staffOtpError').textContent = codeResult.error; return; }
            var pageButton = event.target.closest('[data-staff-page]');
            if (pageButton) { openPage(pageButton.dataset.staffPage); return; }
            var notificationFilterButton = event.target.closest('[data-notification-filter]');
            if (notificationFilterButton) {
                notificationFilter = notificationFilterButton.dataset.notificationFilter;
                renderNotificationSettings();
                return;
            }
            var markAllButton = event.target.closest('[data-notification-mark-all]');
            if (markAllButton) {
                var unreadNotifications = RH.getCurrentUserNotifications().filter(function (item) { return !item.isRead; });
                var markedCount = 0;
                var markError = '';
                unreadNotifications.forEach(function (item) {
                    if (markError) return;
                    var result = RH.markCurrentUserNotificationRead(item.id);
                    if (!result.ok) markError = result.error || 'Không thể cập nhật tất cả thông báo.';
                    else markedCount++;
                });
                staffSettingsMessage = markError
                    ? { text: markedCount ? 'Đã đánh dấu ' + markedCount + ' thông báo; còn một số thông báo chưa cập nhật. ' + markError : markError, error: true }
                    : { text: markedCount ? 'Đã đánh dấu ' + markedCount + ' thông báo là đã đọc.' : 'Không có thông báo chưa đọc.', error: false };
                renderNotificationSettings();
                return;
            }
            var taskNoticeButton = event.target.closest('[data-notification-task]');
            if (taskNoticeButton) {
                var noticeReadResult = RH.markCurrentUserNotificationRead(taskNoticeButton.dataset.notificationId);
                if (!noticeReadResult.ok) setStaffSettingsMessage(noticeReadResult.error || 'Không thể cập nhật thông báo.', true);
                selectedTaskId = taskNoticeButton.dataset.notificationTask;
                openPage(assignedTasks().some(function (task) { return task.id === selectedTaskId; }) ? 'Chi tiết nhiệm vụ' : 'Danh sách nhiệm vụ');
                return;
            }
            var appearanceOption = event.target.closest('[data-appearance-option]');
            if (appearanceOption) {
                appearanceDraft[appearanceOption.dataset.appearanceOption] = appearanceOption.dataset.value;
                staffSettingsMessage = null;
                renderAppearanceSettings();
                var selectedOption = Array.prototype.filter.call(staffContent.querySelectorAll('[data-appearance-option]'), function (option) {
                    return option.dataset.appearanceOption === appearanceOption.dataset.appearanceOption && option.dataset.value === appearanceOption.dataset.value;
                })[0];
                if (selectedOption) selectedOption.focus();
                return;
            }
            var appearanceDevice = event.target.closest('[data-appearance-device]');
            if (appearanceDevice) {
                appearancePreviewDevice = appearanceDevice.dataset.appearanceDevice;
                renderAppearanceSettings();
                var selectedDevice = staffContent.querySelector('[data-appearance-device="' + appearancePreviewDevice + '"]');
                if (selectedDevice) selectedDevice.focus();
                return;
            }
            var appearanceAction = event.target.closest('[data-appearance-action]');
            if (appearanceAction) {
                var appearanceActionName = appearanceAction.dataset.appearanceAction;
                if (appearanceActionName === 'reset') {
                    appearanceDraft = { theme: 'system', density: 'comfortable', fontSize: 'medium', accentColor: 'blue' };
                    staffSettingsMessage = { text: 'Đã khôi phục mặc định. Nhấn Lưu cài đặt để áp dụng.', error: false };
                    renderAppearanceSettings();
                    return;
                }
                if (appearanceActionName === 'cancel') {
                    var savedAppearance = RH.getCurrentUserSettings();
                    appearanceDraft = { theme: savedAppearance.theme, density: savedAppearance.density, fontSize: savedAppearance.fontSize, accentColor: savedAppearance.accentColor };
                    staffSettingsMessage = { text: 'Đã hủy các thay đổi chưa lưu.', error: false };
                    renderAppearanceSettings();
                    return;
                }
                if (appearanceActionName === 'save') {
                    var savedResult = RH.updateCurrentUserSettings({
                        theme: appearanceDraft.theme,
                        density: appearanceDraft.density,
                        fontSize: appearanceDraft.fontSize,
                        accentColor: appearanceDraft.accentColor
                    });
                    if (!savedResult.ok) {
                        staffSettingsMessage = { text: savedResult.error || 'Không thể lưu cài đặt giao diện.', error: true };
                        renderAppearanceSettings();
                        return;
                    }
                    appearanceDraft = { theme: savedResult.preferences.theme, density: savedResult.preferences.density, fontSize: savedResult.preferences.fontSize, accentColor: savedResult.preferences.accentColor };
                    document.body.classList.toggle('staff-density-compact', savedResult.preferences.density === 'compact');
                    staffSettingsMessage = { text: 'Cài đặt giao diện đã được lưu và áp dụng.', error: false };
                    renderAppearanceSettings();
                    return;
                }
            }
            var profileTabButton = event.target.closest('[data-profile-tab]');
            if (profileTabButton) {
                profileTab = profileTabButton.dataset.profileTab;
                renderProfile();
                return;
            }
            var profileTaskFilter = event.target.closest('[data-profile-task-filter]');
            if (profileTaskFilter) {
                var filter = profileTaskFilter.dataset.profileTaskFilter;
                staffFilters.search = '';
                staffFilters.priority = 'all';
                staffFilters.building = 'all';
                staffFilters.from = '';
                staffFilters.to = '';
                staffFilters.status = filter === 'pending' ? 'Chờ tiếp nhận' :
                    (filter === 'progress' ? 'Đang xử lý' : (filter === 'completed' ? 'completed' : 'all'));
                staffFilters.dueStatus = filter === 'overdue' ? 'overdue' : 'all';
                openPage('Danh sách nhiệm vụ');
                return;
            }
            if (event.target.closest('[data-profile-refresh]')) {
                profileEditing = false;
                profileDraftAvatar = '';
                profileFieldErrors = {};
                staffSettingsMessage = null;
                renderProfile();
                return;
            }
            if (event.target.closest('[data-profile-edit]')) {
                profileEditing = true;
                profileTab = 'personal';
                profileFieldErrors = {};
                staffSettingsMessage = null;
                renderProfile();
                return;
            }
            if (event.target.closest('[data-profile-cancel]')) {
                profileEditing = false;
                profileDraftAvatar = '';
                profileFieldErrors = {};
                staffSettingsMessage = null;
                renderProfile();
                return;
            }
            var readButton = event.target.closest('[data-notification-read]');
            if (readButton) {
                var readResult = RH.markCurrentUserNotificationRead(readButton.dataset.notificationRead);
                if (!readResult.ok) setStaffSettingsMessage(readResult.error || 'Không thể cập nhật thông báo.', true);
                else staffSettingsMessage = { text: 'Đã đánh dấu thông báo là đã đọc.', error: false };
                renderNotificationSettings();
                return;
            }
            var taskButton = event.target.closest('[data-open-task]');
            if (taskButton) {
                selectedTaskId = taskButton.dataset.openTask;
                openPage('Chi tiết nhiệm vụ');
                return;
            }
            var progressSave = event.target.closest('[data-progress-save]');
            if (progressSave) { saveStaffProgress(progressSave.dataset.progressSave); return; }
            if (event.target.closest('[data-add-material]')) {
                var tableBody = document.getElementById('staffMaterialRows');
                if (tableBody) {
                    var emptyRow = tableBody.querySelector('.staff-progress-empty-row');
                    if (emptyRow) emptyRow.remove();
                    var draftId = 'staff-material-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
                    tableBody.insertAdjacentHTML('beforeend', materialDraftRowMarkup(draftId, tableBody.querySelectorAll('[data-material-row]').length + 1));
                    var newName = tableBody.querySelector('[data-material-row]:last-child [data-material-name]');
                    if (newName) newName.focus();
                }
                return;
            }
            var removeMaterial = event.target.closest('[data-remove-material]');
            if (removeMaterial) {
                var materialRow = removeMaterial.closest('[data-material-row]');
                if (materialRow && materialRow.dataset.materialStatus === 'draft') materialRow.remove();
                return;
            }
            if (event.target.closest('[data-remove-progress-image]')) {
                event.target.closest('[data-progress-image]').remove();
                return;
            }
            if (event.target.closest('[data-remove-receipt]')) {
                event.target.closest('[data-material-receipt]').remove();
                return;
            }
            var actionButton = event.target.closest('[data-task-action]');
            if (actionButton) updateTaskStatus(actionButton.dataset.taskId, actionButton.dataset.taskAction);
        });
        staffContent.addEventListener('submit', async function (event) {
            if (event.target.id === 'staffPasswordForm') {
                event.preventDefault();
                var result = RH.beginOwnPasswordChange({ currentPassword: document.getElementById('staffCurrentPassword').value, newPassword: document.getElementById('staffNewPassword').value, confirmPassword: document.getElementById('staffConfirmPassword').value });
                document.getElementById('staffSecurityMessage').textContent = result.ok ? '' : result.error;
                if (result.ok) { event.target.reset(); presentDemoPasswordCode(result); }
                return;
            }
            if (event.target.id === 'staffOtpForm') {
                event.preventDefault();
                var result = RH.confirmOwnPasswordChange(staffPasswordChallengeId, document.getElementById('staffOtpInput').value);
                if (!result.ok) { document.getElementById('staffOtpError').textContent = result.error; return; }
                document.getElementById('staffOtpDialog').close();
                document.getElementById('staffSecurityMessage').textContent = 'Đổi mật khẩu thành công. Vui lòng đăng nhập lại.';
                alert('Đổi mật khẩu thành công. Vui lòng đăng nhập lại.');
                window.location.replace('index.html?passwordChanged=1');
                return;
            }
            if (event.target.dataset.staffHelpReply) {
                event.preventDefault();
                var replyResult = RHD.update('supportRequests', event.target.dataset.staffHelpReply, { response: event.target.elements.response.value.trim(), status: event.target.elements.status.value });
                if (!replyResult.ok) { alert(replyResult.error); return; }
                renderStaffHelp(); return;
            }
            if (event.target.id === 'staffHelpForm') {
                event.preventDefault();
                if (!staffAllowed('support.create')) { alert('Bạn chưa được cấp quyền gửi yêu cầu hỗ trợ.'); return; }
                var title = document.getElementById('staffHelpTitle').value.trim(), content = document.getElementById('staffHelpDescription').value.trim(), buildingId = document.getElementById('staffHelpBuilding').value;
                if (!title || !content || !buildingId || !RHP.inScope(buildingId)) { alert('Nhập tiêu đề, nội dung và chọn tòa nhà trong phạm vi phụ trách.'); return; }
                var files = Array.from(document.getElementById('staffHelpFiles').files);
                if (files.length > 3 || files.some(function (file) { return file.size > 2 * 1024 * 1024 || !/^image\/(png|jpeg|webp)$/.test(file.type); })) { document.getElementById('staffHelpFormMessage').textContent = 'Chọn tối đa 3 ảnh PNG/JPEG/WebP, không quá 2 MB mỗi ảnh.'; return; }
                var requestType = document.getElementById('staffHelpType').value, priority = document.getElementById('staffHelpPriority').value;
                var button = event.target.querySelector('button[type="submit"]'); button.disabled = true;
                try {
                    var attachments = await Promise.all(files.map(function (file) { return new Promise(function (resolve, reject) { var reader = new FileReader(); reader.onload = function () { resolve({ name: file.name, type: file.type, dataUrl: reader.result }); }; reader.onerror = reject; reader.readAsDataURL(file); }); }));
                    if (!staffAllowed('support.create')) throw new Error('Quyền gửi hỗ trợ hoặc phiên đăng nhập đã thay đổi.');
                    var result = RHD.create('supportRequests', { code: 'NV-' + Date.now(), title: title, description: content, category: requestType, status: 'new', priority: priority, buildingId: buildingId, requesterId: RH_SESSION.id, requesterName: RH_SESSION.name, from: RH_SESSION.name, source: 'staff', messages: [], attachmentFiles: attachments });
                    if (!result.ok) throw new Error(result.error);
                } catch (error) { button.disabled = false; document.getElementById('staffHelpFormMessage').textContent = error.message || 'Không thể lưu yêu cầu. Kiểm tra dung lượng lưu trữ.'; return; }
                renderStaffHelp();
                switchStaffHelpSection('requests');
                document.getElementById('staffHelpMessage').textContent = 'Yêu cầu đã được gửi thành công.';
                document.getElementById('staffHelpMessage').style.color = '#16865e';
                return;
            }
            if (event.target.id !== 'staffProfileForm') return;
            event.preventDefault();
            var emailInput = document.getElementById('staffProfileEmail');
            var phoneInput = document.getElementById('staffProfilePhone');
            var email = emailInput.value.trim();
            var phone = phoneInput.value.trim();
            profileFieldErrors = {
                email: profileFieldError('email', email),
                phone: profileFieldError('phone', phone)
            };
            setProfileFieldError('email', profileFieldErrors.email);
            setProfileFieldError('phone', profileFieldErrors.phone);
            var invalidField = profileFieldErrors.email ? emailInput : (profileFieldErrors.phone ? phoneInput : null);
            if (invalidField) {
                invalidField.focus();
                return;
            }
            var saveButton = document.getElementById('staffProfileSave');
            if (saveButton) { saveButton.disabled = true; saveButton.textContent = 'Đang lưu...'; }
            var result = RH.updateCurrentUserProfile({
                phone: phone,
                email: email,
                avatar: profileDraftAvatar
            });
            if (!result.ok) {
                setStaffSettingsMessage(result.error || 'Không thể lưu hồ sơ.', true);
                if (saveButton) { saveButton.disabled = false; saveButton.textContent = 'Lưu thay đổi'; }
                return;
            }
            profileEditing = false;
            profileFieldErrors = {};
            profileDraftAvatar = result.user.avatar || '';
            staffSettingsMessage = { text: 'Hồ sơ đã được cập nhật.', error: false };
            renderProfile();
        });
        staffContent.addEventListener('input', function (event) {
            if (event.target.matches('[data-material-quantity], [data-material-price]')) {
                var row = event.target.closest('[data-material-row]');
                var quantity = Number(row.querySelector('[data-material-quantity]').value) || 0;
                var price = Number(row.querySelector('[data-material-price]').value) || 0;
                row.dataset.materialLineTotal = String(quantity * price);
                row.querySelector('[data-material-amount]').textContent = compensationMoney(quantity * price);
                updateStaffMaterialTotal();
                return;
            }
            if (event.target.id === 'staffNotificationSearch') {
                notificationSearch = event.target.value;
                renderNotificationList(RH.getCurrentUserNotifications().slice().sort(function (a, b) {
                    return Number(b.createdAt || 0) - Number(a.createdAt || 0);
                }));
                return;
            }
            var field = event.target.id === 'staffProfileEmail' ? 'email' : (event.target.id === 'staffProfilePhone' ? 'phone' : '');
            if (!field || !profileFieldErrors[field]) return;
            setProfileFieldError(field, profileFieldError(field, event.target.value.trim()));
        });
        staffContent.addEventListener('change', function (event) {
            if (event.target.id === 'staffHelpFiles') { previewStaffHelpFiles(); return; }
            if (event.target.id === 'staffProgressImageFile') {
                var progressInput = event.target;
                var currentImages = document.querySelectorAll('#staffProgressImages [data-progress-image]').length;
                if (currentImages >= 5) { showProgressMessage('Chỉ có thể tải tối đa 5 ảnh tiến độ.', true); progressInput.value = ''; return; }
                readStaffProgressImage(progressInput.files && progressInput.files[0]).then(function (image) {
                    document.getElementById('staffProgressImages').insertAdjacentHTML('afterbegin', staffProgressImageMarkup(image, true));
                    progressInput.value = '';
                }).catch(function (error) {
                    showProgressMessage(error.message, true);
                    progressInput.value = '';
                });
                return;
            }
            if (event.target.matches('[data-material-receipt-file]')) {
                var receiptInput = event.target;
                readStaffProgressImage(receiptInput.files && receiptInput.files[0]).then(function (image) {
                    var oldReceipt = receiptInput.closest('[data-label="Hóa đơn/chứng từ"]').querySelector('[data-material-receipt]');
                    if (oldReceipt) oldReceipt.remove();
                    receiptInput.insertAdjacentHTML('beforebegin', '<figure class="staff-progress-receipt" data-material-receipt data-receipt-name="' + escapeHtml(image.name) + '" data-receipt-type="' + escapeHtml(image.type) + '" data-receipt-url="' + escapeHtml(image.dataUrl) + '"><a href="' + escapeHtml(image.dataUrl) + '" target="_blank" rel="noopener"><img src="' + escapeHtml(image.dataUrl) + '" alt="Xem trước chứng từ"></a><button type="button" data-remove-receipt aria-label="Xóa chứng từ">×</button></figure>');
                    receiptInput.value = '';
                }).catch(function (error) {
                    showProgressMessage(error.message, true);
                    receiptInput.value = '';
                });
                return;
            }
            var target = event.target;
            if (target.id === 'staffActivityFrom' || target.id === 'staffActivityTo' ||
                target.id === 'staffActivityStatus' || target.id === 'staffActivityType') {
                var activityFilterKey = {
                    staffActivityFrom: 'from',
                    staffActivityTo: 'to',
                    staffActivityStatus: 'status',
                    staffActivityType: 'type'
                }[target.id];
                profileActivityFilters[activityFilterKey] = target.value;
                renderProfile();
                return;
            }
            if (target.id === 'staffAvatarFile') {
                var file = target.files && target.files[0];
                if (!file) return;
                if (!/^image\/(png|jpeg|webp)$/.test(file.type) || file.size > 2 * 1024 * 1024) {
                    setStaffSettingsMessage('Chọn ảnh PNG, JPEG hoặc WebP có dung lượng tối đa 2 MB.', true);
                    target.value = '';
                    return;
                }
                var reader = new FileReader();
                reader.onload = function () {
                    profileDraftAvatar = String(reader.result || '');
                    var preview = document.getElementById('staffAvatarPreview');
                    if (preview) preview.innerHTML = '<img src="' + escapeHtml(profileDraftAvatar) + '" alt="Ảnh đại diện xem trước">';
                    setStaffSettingsMessage('Ảnh xem trước đã sẵn sàng. Nhấn Lưu thay đổi để áp dụng.', false);
                };
                reader.onerror = function () { setStaffSettingsMessage('Không thể đọc tệp ảnh đã chọn.', true); };
                reader.readAsDataURL(file);
                return;
            }
            var category = target.dataset.notificationCategory;
            var channel = target.dataset.notificationChannel;
            if (category || channel) {
                var notificationPatch = { notifications: { categories: {}, channels: {} } };
                if (category) notificationPatch.notifications.categories[category] = target.checked;
                if (channel) notificationPatch.notifications.channels[channel] = target.checked;
                target.disabled = true;
                try {
                    var notificationResult = RH.updateCurrentUserSettings(notificationPatch);
                    if (!notificationResult.ok) {
                        target.checked = !target.checked;
                        setStaffSettingsMessage(notificationResult.error || 'Không thể lưu tùy chọn thông báo.', true);
                    } else {
                        setStaffSettingsMessage('Tùy chọn thông báo đã được lưu.', false);
                        updateStaffNotificationCount();
                        if (category === 'deadline' && target.checked) syncStaffDueNotifications();
                    }
                } catch (error) {
                    target.checked = !target.checked;
                    setStaffSettingsMessage(error.message || 'Không thể lưu tùy chọn thông báo.', true);
                } finally {
                    target.disabled = false;
                }
            }
        });
        menuItems.forEach(function (item) {
            item.addEventListener('click', function () { openPage(item.dataset.title); });
        });
        document.getElementById('staffNotificationLink').addEventListener('click', function () {
            openPage('Cài đặt thông báo');
        });
        window.addEventListener('residenthub:business-data-changed', function (event) {
            if (!event.detail || event.detail.entity === 'supportRequests' || event.detail.entity === 'cashflows') renderStaffPage();
        });
        window.addEventListener('residenthub:data-changed', function () {
            updateStaffNotificationCount();
            if (currentStaffPage === 'Cài đặt thông báo') renderNotificationSettings();
        });
        window.addEventListener('residenthub:user-updated', function () {
            if (currentStaffPage === 'Hồ sơ cá nhân') renderProfile();
        });
        window.addEventListener('residenthub:preferences-changed', function () {
            if (window.RHTheme) window.RHTheme.apply();
            if (currentStaffPage === 'Cài đặt giao diện') appearanceDraft = null;
            if (currentStaffPage === 'Cài đặt giao diện' || currentStaffPage === 'Cài đặt thông báo') renderStaffPage();
        });
        window.addEventListener('storage', function (event) {
            if (event.key === 'residenthub_account_types' || event.key === 'residenthub_session' || event.key === null) { renderStaffPage(); return; }
            if (event.key === 'residenthub_live_supportRequests' || event.key === 'residenthub_live_cashflows') renderStaffPage();
            if (event.key === 'residenthub_users' || event.key === 'residenthub_internal_data') {
                updateStaffNotificationCount();
                if (currentStaffPage === 'Cài đặt giao diện') appearanceDraft = null;
                renderStaffPage();
            }
        });
        window.addEventListener('pageshow', function (event) { if (event.persisted) renderStaffPage(); });
        document.getElementById('staffUserName').textContent = (RH_SESSION.name || '') + (staffGroupLabels[RH_SESSION.staffGroup] ? ' · ' + staffGroupLabels[RH_SESSION.staffGroup] : '');
        var currentPreferences = RH.getCurrentUserSettings();
        document.body.classList.toggle('staff-density-compact', currentPreferences.density === 'compact');
        updateStaffNotificationCount();
        syncStaffDueNotifications();
        window.setInterval(syncStaffDueNotifications, 60000);
        renderStaffPage();
        document.getElementById('staffMenuToggle').addEventListener('click', function () {
            document.getElementById('staffSidebar').classList.toggle('open');
        });
        document.getElementById('staffLogout').addEventListener('click', function () {
            if (!confirm('Bạn muốn đăng xuất khỏi hệ thống?')) return;
            RH.logout();
            window.location.replace('index.html');
        });
        }
    </script>
