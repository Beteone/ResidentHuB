<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhân viên - ResidentHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="auth.js"></script>
    <script src="data.js"></script>
    <style>
        :root {
            --bg: #f5f8fc;
            --surface: #fff;
            --ink: #10213c;
            --muted: #61708a;
            --line: #e4eaf2;
            --primary: #1683ff;
            --primary-strong: #0d65d5;
        }
        @media (max-width: 1050px) {
            .staff-profile-hero { grid-template-columns:auto minmax(0,1fr); }
            .staff-profile-hero-actions { grid-column:1/-1; }
            .staff-profile-filter-row { grid-template-columns:repeat(2,minmax(0,1fr)); }
        }
        @media (max-width: 560px) {
            .staff-profile-event { grid-template-columns:minmax(0,1fr); gap:4px; }
            .staff-profile-filter-row { grid-template-columns:minmax(0,1fr); }
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: linear-gradient(180deg, #f7f9fc 0%, #edf3fb 100%); color: var(--ink); font-family: 'Be Vietnam Pro', 'Segoe UI', sans-serif; }
        .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 5; width: 260px; overflow-y: auto; background: linear-gradient(180deg, #0c2545 0%, #15395f 100%); border-right: 1px solid rgba(255,255,255,.1); }
        .sidebar-header { display: flex; align-items: center; gap: 12px; padding: 22px 20px; border-bottom: 1px solid rgba(255,255,255,.1); }
        .brand-mark { display: grid; flex: 0 0 38px; width: 38px; height: 38px; place-items: center; border-radius: 11px; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; }
        .brand-name { color: #fff; font-weight: 800; }
        .brand-role { margin-top: 2px; color: #a8bfd9; font-size: 11px; }
        .menu-group { padding: 17px 0 7px; }
        .menu-heading { padding: 0 20px 7px; color: #8da9c7; font-size: 10px; font-weight: 700; letter-spacing: .08em; }
        .menu-item { display: flex; width: calc(100% - 20px); min-height: 42px; align-items: center; gap: 11px; margin: 2px 10px; padding: 9px 12px; border: 0; border-radius: 9px; background: transparent; color: #b9cbe0; cursor: pointer; font: 500 13px 'Be Vietnam Pro', sans-serif; text-align: left; }
        .menu-item:hover { background: rgba(104, 166, 230, .12); color: #fff; }
        .menu-item.active { padding-left: 9px; border-left: 3px solid #1683ff; background: #154273; color: #fff; font-weight: 700; }
        .menu-item i { width: 18px; text-align: center; }
        .menu-item.logout { color: #f2a6a6; }
        .main-content { min-height: 100vh; margin-left: 260px; padding: 26px; }
        .topbar { display: flex; min-height: 76px; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 26px; padding: 16px 22px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.92); }
        .topbar-title { margin: 0; font: 700 20px 'Plus Jakarta Sans', 'Be Vietnam Pro', sans-serif; }
        .topbar-caption { margin-top: 4px; color: var(--muted); font-size: 12px; }
        .user-label { color: var(--muted); font-size: 12px; }
        .content { padding: 8px 2px; }
        .content h1 { margin: 0; font: 700 26px 'Plus Jakarta Sans', 'Be Vietnam Pro', sans-serif; }
        .content p { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
        .staff-summary-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin:20px 0; }
        .staff-summary-card,.staff-panel { border:1px solid var(--line); border-radius:14px; background:var(--surface); box-shadow:0 8px 24px rgba(15,35,64,.04); }
        .staff-summary-card { padding:18px; }
        .staff-summary-card span { display:block; color:var(--muted); font-size:12px; }
        .staff-summary-card strong { display:block; margin-top:7px; font:700 25px 'Plus Jakarta Sans',sans-serif; }
        .staff-panel { margin-top:18px; padding:18px; }
        .staff-panel h2 { margin:0 0 14px; font-size:17px; }
        .staff-toolbar { display:grid; grid-template-columns:minmax(180px,2fr) repeat(5,minmax(130px,1fr)); gap:9px; margin:15px 0; }
        .staff-toolbar input,.staff-toolbar select,.staff-report-input { min-width:0; width:100%; border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--ink); padding:10px 11px; font:inherit; font-size:13px; }
        .staff-table-wrap { width:100%; overflow-x:auto; }
        .staff-table { width:100%; border-collapse:collapse; min-width:760px; text-align:left; }
        .staff-table th,.staff-table td { padding:12px 10px; border-bottom:1px solid var(--line); vertical-align:top; font-size:13px; }
        .staff-table th { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
        .staff-task-open { border:0; padding:0; background:transparent; color:var(--primary-strong); font:600 13px 'Be Vietnam Pro',sans-serif; text-align:left; cursor:pointer; }
        .staff-task-open:hover { text-decoration:underline; }
        .staff-badge { display:inline-flex; align-items:center; border-radius:999px; padding:5px 9px; background:#eaf3ff; color:#0d65d5; font-size:11px; font-weight:700; white-space:nowrap; }
        .staff-badge.waiting { background:#fff4df; color:#9a6700; }
        .staff-badge.progress { background:#eaf3ff; color:#0d65d5; }
        .staff-badge.approval { background:#f3e8ff; color:#7c3aed; }
        .staff-badge.done { background:#e6f8ef; color:#16865e; }
        .staff-badge.rejected { background:#feecec; color:#b42318; }
        .staff-empty { padding:30px 16px; color:var(--muted); text-align:center; }
        .staff-compensation-intro { margin:0 0 14px; color:var(--muted); font-size:12px; line-height:1.6; }
        .staff-compensation-toolbar { display:grid; grid-template-columns:minmax(170px,1.3fr) repeat(4,minmax(130px,1fr)); gap:9px; margin:15px 0; }
        .staff-compensation-toolbar input,.staff-compensation-toolbar select { min-width:0; width:100%; min-height:40px; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--ink); padding:9px 10px; font:inherit; font-size:12px; }
        .staff-panel .staff-compensation-section-title { display:flex; align-items:center; gap:8px; margin:28px 0 12px; font-size:15px; }
        .staff-compensation-section-title i { color:var(--primary); }
        .staff-compensation-empty { padding:22px 14px; color:var(--muted); text-align:center; line-height:1.6; }
        .staff-compensation-note { margin:12px 0 0; color:var(--muted); font-size:11px; line-height:1.6; }
        @media (max-width: 860px) { .staff-compensation-toolbar { grid-template-columns:repeat(2,minmax(0,1fr)); } }
        @media (max-width: 560px) { .staff-compensation-toolbar { grid-template-columns:minmax(0,1fr); } }
        .staff-detail-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:16px; }
        .staff-detail-item { padding:12px; border-radius:10px; background:#f7f9fc; }
        .staff-detail-item small { display:block; margin-bottom:5px; color:var(--muted); }
        .staff-detail-item strong { display:block; line-height:1.5; overflow-wrap:anywhere; }
        .staff-description { white-space:pre-wrap; line-height:1.7; color:#334155; }
        .staff-actions { display:flex; flex-wrap:wrap; gap:9px; margin-top:16px; }
        .staff-action-btn { border:0; border-radius:9px; background:var(--primary); color:#fff; padding:10px 14px; font:600 13px 'Be Vietnam Pro',sans-serif; cursor:pointer; }
        .staff-action-btn.secondary { border:1px solid var(--line); background:#fff; color:var(--ink); }
        .staff-action-btn:disabled { opacity:.55; cursor:not-allowed; }
        .staff-linked-request { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
        .staff-linked-request span { border:1px solid #dbeafe; border-radius:8px; padding:7px 9px; background:#eff6ff; color:#1d4ed8; font-size:12px; }
        .staff-attachments { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
        .staff-attachments img { width:130px; height:96px; object-fit:cover; border:1px solid var(--line); border-radius:9px; }
        .menu-toggle { display: none; width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); }
        .staff-notification-link { position:relative; display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--ink); padding:9px 12px; font:600 12px 'Be Vietnam Pro',sans-serif; cursor:pointer; }
        .staff-notification-count { display:inline-grid; min-width:20px; height:20px; place-items:center; border-radius:99px; background:#ef4444; color:#fff; font-size:10px; }
        .staff-settings-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
        .staff-profile-heading { display:flex; align-items:center; gap:16px; margin-bottom:20px; }
        .staff-avatar { display:grid; width:80px; height:80px; flex:0 0 80px; place-items:center; overflow:hidden; border-radius:50%; background:#eaf3ff; color:#0d65d5; font-size:24px; font-weight:700; }
        .staff-avatar img { width:100%; height:100%; object-fit:cover; }
        .staff-profile-page { max-width:1120px; }
        .staff-profile-description { margin:0 0 18px !important; }
        .staff-profile-layout { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); align-items:start; gap:18px; }
        .staff-profile-column { display:grid; min-width:0; gap:18px; }
        .staff-profile-card { min-width:0; margin:0; padding:22px; }
        .staff-profile-heading { align-items:flex-start; }
        .staff-profile-heading h2 { font-size:19px; }
        .staff-profile-identity { min-width:0; }
        .staff-profile-identity p { margin:6px 0 0; color:var(--muted); font-size:12px; }
        .staff-profile-actions { margin-top:10px; }
        .staff-profile-actions .staff-action-btn { min-height:38px; }
        .staff-profile-actions label { cursor:pointer; }
        .staff-profile-section-title { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 0 16px; font-size:16px; }
        .staff-profile-section-title i { color:var(--muted); font-size:13px; }
        .staff-profile-meta { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
        .staff-profile-meta span { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:999px; padding:6px 10px; color:var(--muted); font-size:11px; }
        .staff-profile-meta .staff-profile-status { border-color:#bce8d1; background:#effaf4; color:#16865e; }
        .staff-profile-meta .staff-profile-status.inactive { border-color:#f1d7a6; background:#fff8e8; color:#9a6700; }
        .staff-profile-meta .staff-profile-status.locked { border-color:#f2c6c6; background:#fff1f1; color:#b42318; }
        .staff-profile-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:16px 0; }
        .staff-profile-breadcrumb { color:var(--muted); font-size:12px; }
        .staff-profile-tabs { display:flex; gap:7px; overflow-x:auto; margin:16px 0; padding:3px 1px 8px; }
        .staff-profile-tab { flex:0 0 auto; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--muted); padding:9px 12px; font:600 12px 'Be Vietnam Pro',sans-serif; cursor:pointer; }
        .staff-profile-tab.active { border-color:#b8d8ff; background:#eaf3ff; color:#0d65d5; }
        .staff-profile-hero { display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:18px; margin-top:16px; }
        .staff-profile-hero .staff-profile-heading { margin:0; }
        .staff-profile-hero-meta { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:12px; }
        .staff-profile-stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
        .staff-profile-stat { width:100%; border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink); padding:15px; text-align:left; cursor:pointer; }
        .staff-profile-stat:hover { border-color:#b8d8ff; box-shadow:0 6px 18px rgba(15,35,64,.06); }
        .staff-profile-stat span { display:block; color:var(--muted); font-size:11px; }
        .staff-profile-stat strong { display:block; margin-top:6px; font:700 23px 'Plus Jakarta Sans',sans-serif; }
        .staff-profile-progress { height:8px; overflow:hidden; border-radius:99px; background:#e8eef6; }
        .staff-profile-progress span { display:block; height:100%; border-radius:inherit; background:var(--primary); }
        .staff-profile-timeline { display:grid; gap:0; }
        .staff-profile-event { display:grid; grid-template-columns:110px minmax(0,1fr); gap:12px; border-bottom:1px solid var(--line); padding:14px 0; }
        .staff-profile-event:last-child { border-bottom:0; }
        .staff-profile-event time { color:var(--muted); font-size:11px; }
        .staff-profile-event p { margin:4px 0 0; font-size:12px; line-height:1.6; overflow-wrap:anywhere; }
        .staff-profile-event strong { font-size:13px; }
        .staff-profile-readonly { border:1px solid var(--line); border-radius:9px; background:#f7f9fc; padding:11px 12px; overflow-wrap:anywhere; }
        .staff-profile-filter-row { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:9px; margin:14px 0; }
        .staff-profile-filter-row select,.staff-profile-filter-row input { min-width:0; width:100%; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--ink); padding:9px; font:inherit; font-size:12px; }
        .staff-profile-action-link { border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--ink); padding:9px 12px; font:600 12px 'Be Vietnam Pro',sans-serif; cursor:pointer; }
        .staff-profile-work-list { display:grid; gap:0; }
        .staff-profile-work-item { display:flex; align-items:flex-start; gap:12px; padding:13px 0; border-bottom:1px solid var(--line); }
        .staff-profile-work-item:last-child { border-bottom:0; padding-bottom:0; }
        .staff-profile-work-icon { display:grid; width:34px; height:34px; flex:0 0 34px; place-items:center; border-radius:9px; background:#f1f6fc; color:#526982; }
        .staff-profile-work-item small { display:block; margin:0 0 4px; color:var(--muted); font-size:11px; }
        .staff-profile-work-item strong { display:block; overflow-wrap:anywhere; font-size:13px; font-weight:600; line-height:1.5; }
        .staff-profile-note { margin:14px 0 0; color:var(--muted); font-size:11px; line-height:1.5; }
        .staff-profile-contact-fields { display:grid; gap:18px; }
        .staff-profile-contact-value { min-height:24px; overflow-wrap:anywhere; color:var(--ink); font-size:14px; line-height:1.6; }
        .staff-profile-field-error { display:block; min-height:16px; margin-top:5px; color:#b42318; font-size:11px; }
        .staff-profile-field-error:empty { display:none; }
        .staff-profile-page .staff-field input[aria-invalid="true"] { border-color:#d92d20; }
        .staff-profile-message { min-height:20px; margin:12px 0 0; color:#16865e; font-size:12px; }
        .staff-profile-message.error { color:#b42318; }
        .staff-profile-contact-actions { display:flex; flex-wrap:wrap; gap:9px; margin-top:22px; }
        .staff-profile-contact-actions .staff-action-btn { min-height:42px; }
        .staff-visually-hidden { position:absolute; width:1px; height:1px; padding:0; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; clip-path:inset(50%); border:0; }
        .staff-visually-hidden:focus + label { outline:3px solid rgba(22,131,255,.28); outline-offset:2px; }
        .staff-profile-page .staff-action-btn:hover:not(:disabled) { background:var(--primary-strong); }
        .staff-profile-page .staff-action-btn.secondary:hover:not(:disabled) { background:#f5f8fc; }
        .staff-profile-page .staff-action-btn:focus-visible,.staff-profile-actions label:focus-visible { outline:3px solid rgba(22,131,255,.28); outline-offset:2px; }
        .staff-profile-load-error { border-color:#f2c6c6; color:#b42318; }
        .staff-profile-page { max-width:none; }
        .staff-profile-toolbar { margin:2px 0 12px; }
        .staff-profile-toolbar .staff-profile-action-link { display:inline-flex; align-items:center; gap:7px; color:var(--primary-strong); }
        .staff-profile-hero { position:relative; grid-template-columns:auto minmax(0,1fr) auto; gap:16px; margin:0 0 12px; padding:18px 20px; overflow:hidden; border-color:#dbe9fb; background:linear-gradient(112deg,#eef6ff 0%,var(--surface) 72%); }
        .staff-profile-hero:before { position:absolute; inset:0 auto 0 0; width:4px; background:var(--primary); content:''; }
        .staff-profile-hero .staff-avatar { width:82px; height:82px; flex-basis:82px; border:3px solid #fff; box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 55%,transparent); background:#dcecff; color:var(--primary-strong); font-size:23px; }
        .staff-profile-hero .staff-profile-heading { margin:0; }
        .staff-profile-hero .staff-profile-identity h2 { font:700 19px 'Plus Jakarta Sans','Be Vietnam Pro',sans-serif; letter-spacing:-.02em; }
        .staff-profile-identity p { margin:5px 0 0; }
        .staff-profile-meta { gap:7px; margin-top:9px; }
        .staff-profile-meta span { padding:5px 9px; background:rgba(255,255,255,.72); font-size:11px; }
        .staff-profile-meta .staff-profile-status { background:#effaf4; }
        .staff-profile-hero-meta { grid-template-columns:repeat(4,minmax(0,1fr)); gap:0; margin-top:12px; padding-top:10px; border-top:1px solid var(--line); }
        .staff-profile-hero-meta .staff-profile-work-item { align-items:center; padding:2px 10px; border:0; border-right:1px solid var(--line); }
        .staff-profile-hero-meta .staff-profile-work-item:first-child { padding-left:0; }
        .staff-profile-hero-meta .staff-profile-work-item:last-child { padding-right:0; border-right:0; }
        .staff-profile-hero-meta .staff-profile-work-icon { width:28px; height:28px; flex-basis:28px; background:transparent; color:var(--primary-strong); }
        .staff-profile-hero-meta .staff-profile-work-item small { font-size:10px; }
        .staff-profile-hero-meta .staff-profile-work-item strong { font-size:11px; }
        .staff-profile-hero-actions { display:flex; align-self:start; gap:7px; }
        .staff-profile-hero-actions .staff-profile-action-link { min-height:36px; white-space:nowrap; }
        .staff-profile-hero-actions .staff-profile-edit-link { border-color:var(--primary); background:var(--primary); color:#fff; }
        .staff-profile-overview-grid { display:grid; grid-template-columns:minmax(0,1.08fr) minmax(0,1fr); align-items:stretch; gap:12px; }
        .staff-profile-overview-column { display:grid; min-width:0; align-content:start; gap:12px; }
        .staff-profile-overview-grid .staff-profile-card { padding:16px; }
        .staff-profile-section-title { margin-bottom:12px; font-size:16px; }
        .staff-profile-title-label { display:flex; align-items:center; gap:9px; }
        .staff-profile-title-icon { display:grid; width:28px; height:28px; flex:0 0 28px; place-items:center; border-radius:9px; background:#edf5ff; color:var(--primary); font-size:12px; }
        .staff-profile-mini-action { border:1px solid var(--line); border-radius:7px; background:var(--surface); color:var(--primary-strong); padding:7px 10px; cursor:pointer; font:600 11px 'Be Vietnam Pro',sans-serif; }
        .staff-profile-personal-summary { display:grid; grid-template-columns:82px minmax(0,1fr); align-items:start; gap:13px; }
        .staff-profile-personal-avatar { display:grid; width:78px; height:78px; place-items:center; overflow:hidden; border-radius:50%; background:#e4f0ff; color:var(--primary); font-size:21px; font-weight:700; box-shadow:0 0 0 3px #f4f8ff; }
        .staff-profile-personal-avatar img { width:100%; height:100%; object-fit:cover; }
        .staff-profile-info-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 12px; }
        .staff-profile-info-item { display:flex; min-width:0; gap:8px; padding:9px 0; border-bottom:1px solid var(--line); }
        .staff-profile-info-item:nth-last-child(-n+2) { border-bottom:0; }
        .staff-profile-info-icon { display:grid; width:22px; height:22px; flex:0 0 22px; place-items:center; border-radius:7px; background:#f1f6fc; color:#526982; font-size:10px; }
        .staff-profile-info-item small { display:block; margin-bottom:3px; color:var(--muted); font-size:11px; }
        .staff-profile-info-item strong { display:block; overflow-wrap:anywhere; color:var(--ink); font-size:12px; font-weight:600; line-height:1.5; }
        .staff-profile-info-wide { grid-column:1/-1; }
        .staff-profile-readonly-notice { margin:10px 0 0; padding:9px 10px; border-radius:7px; background:#f3f8ff; color:#526982; font-size:11px; line-height:1.55; }
        .staff-profile-readonly-badge { border:1px solid var(--line); border-radius:7px; padding:6px 9px; color:var(--muted); font-size:10px; font-weight:500; white-space:nowrap; }
        .staff-profile-inline-link { border:0; background:transparent; color:var(--primary-strong); cursor:pointer; font:600 11px 'Be Vietnam Pro',sans-serif; white-space:nowrap; }
        .staff-profile-completion { display:grid; gap:7px; margin-top:12px; }
        .staff-profile-completion > div:first-child { display:flex; justify-content:space-between; gap:10px; font-size:12px; }
        .staff-profile-stat-grid { grid-template-columns:repeat(5,minmax(0,1fr)); gap:7px; }
        .staff-profile-stat { position:relative; min-width:0; min-height:67px; padding:9px 8px; border-radius:9px; }
        .staff-profile-stat-icon { display:grid; width:23px; height:23px; place-items:center; margin-bottom:5px; border-radius:7px; background:#edf5ff; color:var(--primary); font-size:11px; }
        .staff-profile-stat[data-profile-task-filter="pending"] .staff-profile-stat-icon { background:#fff4e5; color:#f59e0b; }
        .staff-profile-stat[data-profile-task-filter="progress"] .staff-profile-stat-icon { background:#eff5ff; color:#3b82f6; }

        html[data-theme="dark"] { color-scheme:dark; --bg:#111827; --surface:#1f2937; --ink:#e5edf7; --muted:#a7b4c7; --line:#37465b; --primary:#4b9cff; --primary-strong:#72b0ff; }
        html[data-theme="dark"] body { background:#111827; color:var(--ink); }
        html[data-theme="dark"] .topbar,html[data-theme="dark"] .staff-panel,html[data-theme="dark"] .staff-summary-card { background:#1f2937; }
        html[data-theme="dark"] .staff-detail-item,html[data-theme="dark"] .staff-field input[readonly] { background:#293548; }
        html[data-theme="dark"] .staff-profile-meta .staff-profile-status { border-color:#275a43; background:#19382c; color:#a8e4c7; }
        html[data-theme="dark"] .staff-profile-meta .staff-profile-status.inactive { border-color:#695329; background:#40351e; color:#f4d78f; }
        html[data-theme="dark"] .staff-profile-meta .staff-profile-status.locked { border-color:#713737; background:#432727; color:#ffb4b4; }
        html[data-theme="dark"] .staff-profile-work-icon { background:#293548; color:#c4d0df; }
        html[data-theme="dark"] .staff-profile-page .staff-action-btn.secondary:hover:not(:disabled) { background:#293548; }
        html[data-theme="dark"] .staff-field input,html[data-theme="dark"] .staff-field select,html[data-theme="dark"] .staff-action-btn.secondary,html[data-theme="dark"] .staff-notification-link,html[data-theme="dark"] .staff-notice-read { background:#1f2937; color:var(--ink); }
        html[data-theme="dark"] .staff-description { color:#d6e0ee; }
        html[data-theme="dark"] .staff-linked-request span { border-color:#344e6e; background:#223852; color:#b8d8ff; }
        html[data-theme="dark"] .staff-badge { background:#263b55; color:#b8d8ff; }
        html[data-theme="dark"] .staff-badge.waiting { background:#493c24; color:#f4d78f; }
        html[data-theme="dark"] .staff-badge.approval { background:#3e3158; color:#dcc9ff; }
        html[data-theme="dark"] .staff-badge.done { background:#1c4037; color:#a8e4c7; }
        html[data-theme="dark"] .staff-empty { color:var(--muted); }
        @media (max-width: 1100px) {
            .staff-toolbar,.staff-toolbar[style] { grid-template-columns:repeat(2,minmax(0,1fr)) !important; }
            .staff-toolbar input[type="search"] { grid-column:1/-1; }
        }
        @media (max-width: 900px) {
            .sidebar { box-shadow: 12px 0 30px rgba(15, 35, 64, .12); transform: translateX(-105%); transition: transform .2s ease; }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 16px; }
            .topbar { align-items: flex-start; padding: 14px; }
            .menu-toggle { display: inline-grid; flex: 0 0 40px; place-items: center; }
            .topbar-heading { flex: 1; }
            .user-label { display: none; }
            .content h1 { font-size: 22px; }
            .staff-toolbar { grid-template-columns:repeat(2,minmax(0,1fr)); }
            .staff-toolbar input[type="search"] { grid-column:1/-1; }
            .staff-detail-grid { grid-template-columns:minmax(0,1fr); }
            .staff-panel { padding:14px; }
            .staff-settings-grid,.staff-form-grid { grid-template-columns:minmax(0,1fr); }
            .staff-profile-layout { grid-template-columns:minmax(0,1fr); }
            .staff-profile-card { padding:18px; }
            .staff-profile-contact-actions { display:grid; grid-template-columns:minmax(0,1fr); }
            .topbar { flex-wrap:wrap; }
            .staff-notification-link { margin-left:auto; }
        }
    </style>
    <script src="theme.js"></script>
</head>
<body>
    <script>
        var RH_SESSION = RH.requireRole('staff');
        RHD.setMode('live');
    </script>
    <aside class="sidebar" id="staffSidebar">
        <div class="sidebar-header">
            <div class="brand-mark"><i class="fas fa-house"></i></div>
            <div>
                <div class="brand-name">ResidentHub</div>
                <div class="brand-role">Giao diện Nhân viên</div>
            </div>
        </div>
        <nav aria-label="Menu Nhân viên">
            <div class="menu-group">
                <div class="menu-heading">TỔNG QUAN</div>
                <button class="menu-item" data-title="Tổng quan"><i class="fas fa-chart-line"></i><span>Tổng quan</span></button>
            </div>
            <div class="menu-group">
                <div class="menu-heading">CÔNG VIỆC</div>
                <button class="menu-item active" data-title="Danh sách nhiệm vụ"><i class="fas fa-list-check"></i><span>Danh sách nhiệm vụ</span></button>
                <button class="menu-item" data-title="Cập nhật tiến độ"><i class="fas fa-arrows-rotate"></i><span>Cập nhật tiến độ</span></button>
                <button class="menu-item" data-title="Báo cáo kết quả"><i class="fas fa-file-circle-check"></i><span>Báo cáo kết quả</span></button>
            </div>
            <div class="menu-group">
                <div class="menu-heading">THU NHẬP &amp; CHI PHÍ</div>
                <button class="menu-item" data-title="Tổng hợp tiền công &amp; chi phí"><i class="fas fa-coins"></i><span>Tổng hợp tiền công &amp; chi phí</span></button>
                <button class="menu-item" data-title="Theo dõi trạng thái tiền công"><i class="fas fa-money-check-dollar"></i><span>Theo dõi trạng thái tiền công</span></button>
                <button class="menu-item" data-title="Lịch sử tiền công"><i class="fas fa-clock-rotate-left"></i><span>Lịch sử tiền công</span></button>
            </div>
            <div class="menu-group">
                <div class="menu-heading">CÀI ĐẶT</div>
                <button class="menu-item" data-title="Hồ sơ cá nhân"><i class="fas fa-user"></i><span>Hồ sơ cá nhân</span></button>
                <button class="menu-item" data-title="Cài đặt giao diện"><i class="fas fa-palette"></i><span>Cài đặt giao diện</span></button>
                <button class="menu-item" data-title="Cài đặt thông báo"><i class="fas fa-bell"></i><span>Cài đặt thông báo</span></button>
                <button class="menu-item" data-title="Bảo mật tài khoản"><i class="fas fa-shield-halved"></i><span>Bảo mật tài khoản</span></button>
                <button class="menu-item" data-title="Quyền truy cập"><i class="fas fa-key"></i><span>Quyền truy cập</span></button>
                <button class="menu-item" data-title="Hỗ trợ và thông tin hệ thống"><i class="fas fa-circle-info"></i><span>Hỗ trợ và thông tin hệ thống</span></button>
                <button class="menu-item logout" id="staffLogout"><i class="fas fa-right-from-bracket"></i><span>Đăng xuất</span></button>
            </div>
        </nav>
    </aside>
    <main class="main-content">
        <header class="topbar">
            <button class="menu-toggle" id="staffMenuToggle" aria-label="Mở menu"><i class="fas fa-bars"></i></button>
            <div class="topbar-heading">
                <h2 class="topbar-title" id="staffPageTitle">Danh sách nhiệm vụ</h2>
                <div class="topbar-caption">ResidentHub · Không gian Nhân viên</div>
            </div>
            <div class="user-label" id="staffUserName"></div>
            <button type="button" class="staff-notification-link" id="staffNotificationLink" aria-label="Mở cài đặt thông báo">
                <i class="fas fa-bell"></i><span>Thông báo</span><span class="staff-notification-count" id="staffNotificationCount" hidden>0</span>
            </button>
        </header>
        <section class="content" aria-live="polite">
            <h1 id="staffContentTitle">Danh sách nhiệm vụ</h1>
            <div id="staffContent"></div>
        </section>
    </main>
    <script>
        var menuItems = document.querySelectorAll('.menu-item[data-title]');
        var staffContent = document.getElementById('staffContent');
        var selectedTaskId = '';
        var currentStaffPage = 'Danh sách nhiệm vụ';
        var staffFilters = { search: '', status: 'all', priority: 'all', building: 'all', from: '', to: '', dueStatus: 'all' };
        var wageFilters = { search: '', status: 'all', from: '', to: '' };
        var compensationFilters = { month: todayValue().slice(0, 7), from: '', to: '', status: 'all', search: '' };
        var compensationUsesSampleData = false;
        var staffGroupLabels = {};
        var profileEditing = false;
        var profileDraftAvatar = '';
        var profileFieldErrors = {};
        var staffSettingsMessage = null;
        var notificationFilter = 'all';
        var notificationSearch = '';
        var appearanceDraft = null;
        var appearancePreviewDevice = 'desktop';
        var profileTab = 'overview';
        var profileActivityFilters = { from: '', to: '', status: 'all', type: 'all' };
        RHD.SUPPORT_STAFF_GROUPS.forEach(function (group) { staffGroupLabels[group.id] = group.label; });

        function escapeHtml(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, function (character) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character];
            });
        }

        function assignedTasks() {
            var ownName = String(RH_SESSION.name || '').trim().toLocaleLowerCase();
            var ownEmail = String(RH_SESSION.email || '').trim().toLocaleLowerCase();
            return RHD.list('supportRequests').filter(function (request) {
                if (request.assigneeId) return request.assigneeId === RH_SESSION.id;
                var assignee = String(request.assignee || '').trim().toLocaleLowerCase();
                return !!assignee && (assignee === ownName || assignee === ownEmail);
            }).sort(function (a, b) {
                return Number(b.updatedAt || b.createdAt || 0) - Number(a.updatedAt || a.createdAt || 0);
            });
        }

        function taskStatus(request) {
            if (request.staffTaskStatus === 'pending_approval') return { label: 'Hoàn thành (Chờ Quản lý duyệt)', style: 'approval' };
            if (request.staffTaskStatus === 'approved' || request.status === 'resolved') return { label: 'Hoàn thành', style: 'done' };
            if (request.status === 'closed') return { label: 'Đã đóng', style: 'done' };
            if (request.staffTaskStatus === 'in_progress' || request.status === 'in_progress') return { label: 'Đang xử lý', style: 'progress' };
            return { label: 'Chờ tiếp nhận', style: 'waiting' };
        }

        function groupForTask(request) {
            if (request.staffGroup && staffGroupLabels[request.staffGroup]) return request.staffGroup;
            var category = String(request.category || '').toLocaleLowerCase();
            if (category.indexOf('vệ sinh') !== -1) return 'cleaning';
            if (category.indexOf('an ninh') !== -1) return 'security';
            if (category.indexOf('sửa chữa') !== -1 || category.indexOf('cơ sở vật chất') !== -1) return 'technical';
            return '';
        }

        function buildingForTask(request) {
            var building = request.buildingId ? RHD.get('buildings', request.buildingId) : null;
            var apartment = request.apartmentId ? RHD.get('apartments', request.apartmentId) : null;
            return {
                building: building,
                apartment: apartment,
                label: (building ? building.name : '') + (apartment ? ' · Căn ' + apartment.name : '')
            };
        }

        function dateValue(value) {
            if (!value) return '';
            var text = String(value);
            if (/^\d{4}-\d{2}-\d{2}/.test(text)) return text.slice(0, 10);
            var date = new Date(value);
            return isNaN(date.getTime()) ? '' : date.toISOString().slice(0, 10);
        }

        function todayValue() {
            var now = new Date();
            return now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
        }

        function dateLabel(value) {
            var date = dateValue(value);
            return date ? new Date(date + 'T00:00:00').toLocaleDateString('vi-VN') : 'Chưa đặt hạn';
        }

        function wageTotal(wage) {
            var adjustments = Array.isArray(wage && wage.adjustments) ? wage.adjustments : [];
            return (Number(wage && wage.baseAmount) || 0) + adjustments.reduce(function (sum, item) { return sum + (Number(item.amount) || 0); }, 0);
        }

        function currentStaffAccount() {
            return RH.getUsers().filter(function (user) { return user.id === RH_SESSION.id; })[0] || {};
        }

        function setProfileFieldError(field, message) {
            profileFieldErrors[field] = message;
            var input = document.getElementById('staffProfile' + (field === 'phone' ? 'Phone' : 'Email'));
            var error = document.getElementById('staffProfile' + (field === 'phone' ? 'Phone' : 'Email') + 'Error');
            if (input) input.setAttribute('aria-invalid', message ? 'true' : 'false');
            if (error) error.textContent = message || '';
        }

        function profileFieldError(field, value) {
            if (field === 'email') {
                if (!value) return 'Vui lòng nhập email liên hệ.';
                if (value.length > 254 || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) return 'Vui lòng nhập địa chỉ email hợp lệ.';
                return '';
            }
            if (value && (!/^[+]?[0-9\s().-]+$/.test(value) || value.replace(/\D/g, '').length < 7 || value.replace(/\D/g, '').length > 15)) {
                return 'Vui lòng nhập số điện thoại hợp lệ (7–15 chữ số).';
            }
            return '';
        }

        function setStaffSettingsMessage(text, isError) {
            staffSettingsMessage = { text: text, error: !!isError };
            var node = document.getElementById('staffSettingsMessage');
            if (node) {
                node.textContent = text;
                node.classList.toggle('error', !!isError);
            }
        }

        function profileTimestamp(value) {
            if (!value) return 0;
            var timestamp = typeof value === 'number' ? value : new Date(value).getTime();
            return isFinite(timestamp) ? timestamp : 0;
        }

        function profileDateTime(value) {
            var timestamp = profileTimestamp(value);
            return timestamp ? new Date(timestamp).toLocaleString('vi-VN') : 'Chưa cập nhật';
        }

        function profileTaskCompleted(task) {
            return task.staffTaskStatus === 'approved' || task.status === 'resolved' || task.status === 'closed';
        }

        function profileTaskStats(tasks) {
            var today = todayValue();
            var completed = tasks.filter(profileTaskCompleted).length;
            return {
                total: tasks.length,
                pending: tasks.filter(function (task) { return taskStatus(task).label === 'Chờ tiếp nhận'; }).length,
                progress: tasks.filter(function (task) { return taskStatus(task).label === 'Đang xử lý'; }).length,
                completed: completed,
                overdue: tasks.filter(function (task) {
                    var due = dateValue(task.dueAt || task.scheduledAt);
                    return due && due < today && !profileTaskCompleted(task);
                }).length,
                completionRate: tasks.length ? Math.round(completed / tasks.length * 100) : 0
            };
        }

        function profileActivityLabel(category) {
            return {
                taskNew: 'Nhiệm vụ mới',
                assignmentChanged: 'Thay đổi phân công',
                taskStatus: 'Cập nhật trạng thái',
                infoRequest: 'Yêu cầu bổ sung thông tin',
                deadline: 'Hạn xử lý'
            }[category] || 'Hoạt động';
        }

        function renderProfileActivity(tasks) {
            var taskById = {};
            tasks.forEach(function (task) { taskById[task.id] = task; });
            var allowedCategories = ['taskNew', 'assignmentChanged', 'taskStatus', 'infoRequest', 'deadline'];
            var events = RH.getCurrentUserNotifications().filter(function (notice) {
                return notice.refType === 'task' && allowedCategories.indexOf(notice.subType) !== -1;
            }).map(function (notice) {
                var task = taskById[notice.refId] || null;
                return {
                    at: notice.createdAt,
                    task: task,
                    type: notice.subType,
                    title: notice.title || profileActivityLabel(notice.subType),
                    body: notice.body || '',
                    status: task ? taskStatus(task).label : 'Chưa cập nhật'
                };
            });
            tasks.forEach(function (task) {
                if (task.staffCompletedAt) events.push({
                    at: task.staffCompletedAt,
                    task: task,
                    type: 'taskStatus',
                    title: 'Đã gửi báo cáo hoàn thành',
                    body: '',
                    status: taskStatus(task).label
                });
                var hasTimestampedNotice = events.some(function (item) {
                    return item.task.id === task.id && profileTimestamp(item.at) === profileTimestamp(task.updatedAt);
                });
                if (task.updatedAt && profileTimestamp(task.updatedAt) !== profileTimestamp(task.createdAt) &&
                    profileTimestamp(task.updatedAt) !== profileTimestamp(task.staffCompletedAt) && !hasTimestampedNotice) events.push({
                    at: task.updatedAt,
                    task: task,
                    type: 'taskStatus',
                    title: 'Cập nhật gần nhất',
                    body: 'Trạng thái hiện tại: ' + taskStatus(task).label,
                    status: taskStatus(task).label
                });
            });
            events.sort(function (a, b) { return profileTimestamp(b.at) - profileTimestamp(a.at); });
            return events.filter(function (item) {
                var day = dateValue(item.at);
                return (!profileActivityFilters.from || day >= profileActivityFilters.from) &&
                    (!profileActivityFilters.to || day <= profileActivityFilters.to) &&
                    (profileActivityFilters.status === 'all' || item.status === profileActivityFilters.status) &&
                    (profileActivityFilters.type === 'all' || item.type === profileActivityFilters.type);
            });
        }

        function renderProfile() {
            var user = currentStaffAccount();
            if (!user.id || user.id !== RH_SESSION.id) {
                staffContent.innerHTML = '<div class="staff-panel staff-profile-load-error" role="alert">Không thể tải hồ sơ tài khoản. Vui lòng tải lại trang hoặc đăng nhập lại.</div>';
                return;
            }
            if (!profileEditing) profileDraftAvatar = user.avatar || '';
            var tasks = assignedTasks();
            var stats = profileTaskStats(tasks);
            var avatar = profileDraftAvatar || user.avatar || '';
            var avatarMarkup = /^data:image\/(?:png|jpeg|webp|gif);base64,/.test(avatar) || /^https:\/\//i.test(avatar)
                ? '<img src="' + escapeHtml(avatar) + '" alt="Ảnh đại diện của ' + escapeHtml(user.name || 'nhân viên') + '">'
                : escapeHtml(String(user.name || 'NV').split(/\s+/).map(function (part) { return part.charAt(0); }).slice(-2).join('').toLocaleUpperCase());
            var buildings = (Array.isArray(user.buildingIds) ? user.buildingIds : []).map(function (id) { return RHD.get('buildings', id); }).filter(Boolean);
            var buildingNames = buildings.map(function (building) { return building.shortName || building.name; });
            if (!buildingNames.length && user.building) buildingNames.push(user.building);
            var managerNames = buildings.map(function (building) {
                var manager = building.managerId ? RH.getUsers().filter(function (account) { return account.id === building.managerId; })[0] : null;
                return manager ? manager.name : '';
            }).filter(function (name, index, names) { return name && names.indexOf(name) === index; });
            var statusLabels = { active: 'Đang hoạt động', inactive: 'Tạm ngưng', locked: 'Đã khóa', pending: 'Chưa kích hoạt' };
            var accountStatus = statusLabels[user.status] || 'Chưa cập nhật';
            var accountStatusStyle = user.status === 'locked' ? 'locked' : (user.status === 'inactive' || user.status === 'pending' ? 'inactive' : '');
            var contactEmail = user.contactEmail || user.email || '';
            var emailError = profileFieldErrors.email || '';
            var phoneError = profileFieldErrors.phone || '';
            var accountDepartment = user.department || staffGroupLabels[user.staffGroup] || '';
            var scopeDescription = (RHD.SUPPORT_STAFF_GROUPS || []).filter(function (group) { return group.id === user.staffGroup; })[0];
            var avatarActions = profileEditing
                ? '<div class="staff-profile-actions"><input class="staff-visually-hidden" id="staffAvatarFile" type="file" accept="image/png,image/jpeg,image/webp" aria-label="Chọn ảnh đại diện"><label class="staff-action-btn secondary" for="staffAvatarFile">Đổi ảnh đại diện</label></div>'
                : '';
            var tabs = [
                ['overview', 'Tổng quan', 'fa-house'],
                ['personal', 'Thông tin cá nhân', 'fa-user'],
                ['work', 'Công tác', 'fa-briefcase'],
                ['tasks', 'Công việc', 'fa-chart-line'],
                ['activity', 'Lịch sử hoạt động', 'fa-clock'],
                ['account', 'Tài khoản', 'fa-users']
            ];
            var tabMarkup = tabs.map(function (tab) {
                return '<button type="button" role="tab" class="staff-profile-tab' + (profileTab === tab[0] ? ' active' : '') + '" id="staffProfileTab-' + tab[0] + '" data-profile-tab="' + tab[0] + '" aria-label="' + tab[1] + '" title="' + tab[1] + '" aria-selected="' + (profileTab === tab[0] ? 'true' : 'false') + '" tabindex="' + (profileTab === tab[0] ? '0' : '-1') + '" aria-controls="staffProfileTabPanel"><i class="fas ' + tab[2] + '" aria-hidden="true"></i><span>' + tab[1] + '</span></button>';
            }).join('');
            var statMarkup = [
                ['all', 'Nhiệm vụ được giao', stats.total, 'fa-clipboard-list'],
                ['pending', 'Chưa thực hiện', stats.pending, 'fa-clock'],
                ['progress', 'Đang xử lý', stats.progress, 'fa-sun'],
                ['completed', 'Đã hoàn thành', stats.completed, 'fa-check'],
                ['overdue', 'Quá hạn', stats.overdue, 'fa-triangle-exclamation']
            ].map(function (item) {
                return '<button type="button" class="staff-profile-stat" data-profile-task-filter="' + item[0] + '"><span class="staff-profile-stat-icon"><i class="fas ' + item[3] + '" aria-hidden="true"></i></span><span>' + item[1] + '</span><strong>' + item[2] + '</strong></button>';
            }).join('');
            var personalMarkup = '<div class="staff-profile-layout"><article class="staff-panel staff-profile-card"><h2 class="staff-profile-section-title">Thông tin định danh</h2>' +
                '<div class="staff-detail-grid"><div class="staff-detail-item"><small>Họ và tên</small><strong>' + escapeHtml(user.name || 'Chưa cập nhật') + '</strong></div><div class="staff-detail-item"><small>Mã nhân viên</small><strong>' + escapeHtml(user.employeeCode || 'Chưa cập nhật') + '</strong></div>' +
                '<div class="staff-detail-item"><small>Ngày sinh</small><strong>' + escapeHtml(user.dateOfBirth || 'Chưa cập nhật') + '</strong></div><div class="staff-detail-item"><small>Giới tính</small><strong>' + escapeHtml(user.gender || 'Chưa cập nhật') + '</strong></div></div>' +
                '<p class="staff-profile-note"><i class="fas fa-lock" aria-hidden="true"></i> Họ tên và mã nhân viên do quản lý kiểm soát.</p></article>' +
                '<form id="staffProfileForm" class="staff-panel staff-profile-card" novalidate><h2 class="staff-profile-section-title">Thông tin liên hệ</h2><div class="staff-profile-contact-fields">' +
                '<div class="staff-field"><label for="staffProfilePhone">Số điện thoại</label>' + (profileEditing
                    ? '<input id="staffProfilePhone" type="tel" autocomplete="tel" inputmode="tel" maxlength="20" value="' + escapeHtml(user.phone || '') + '" aria-describedby="staffProfilePhoneError" aria-invalid="' + (phoneError ? 'true' : 'false') + '"><span class="staff-profile-field-error" id="staffProfilePhoneError">' + escapeHtml(phoneError) + '</span>'
                    : '<div class="staff-profile-contact-value">' + escapeHtml(user.phone || 'Chưa cập nhật') + '</div>') + '</div>' +
                '<div class="staff-field"><label for="staffProfileEmail">Email liên hệ</label>' + (profileEditing

        function renderNotificationList(notifications) {
            var list = document.getElementById('staffNotificationList');
            if (!list) return;
            var search = notificationSearch.trim().toLocaleLowerCase('vi');
            var filtered = notifications.filter(function (item) {
                if (notificationFilter === 'unread' && item.isRead) return false;
                if (notificationFilter === 'read' && !item.isRead) return false;
                var category = notificationLabel(item.subType);
                var text = [item.title, item.body, category && category[0]].join(' ').toLocaleLowerCase('vi');
                return !search || text.indexOf(search) !== -1;
            });
            if (!filtered.length) {
                var message = search ? 'Không tìm thấy thông báo phù hợp với từ khóa.' :
                    (notificationFilter === 'unread' ? 'Bạn đã xem hết thông báo chưa đọc.' :
                        (notificationFilter === 'read' ? 'Chưa có thông báo đã đọc.' : 'Các thông báo mới sẽ xuất hiện tại đây khi có sự kiện liên quan đến công việc của bạn.'));
                list.innerHTML = '<div class="staff-notification-empty"><i class="fas fa-bell" aria-hidden="true"></i><strong>' +
                    (search ? 'Không có kết quả' : (notificationFilter === 'all' && !notifications.length ? 'Bạn chưa có thông báo' : 'Không có thông báo')) +
                    '</strong><span>' + escapeHtml(message) + '</span></div>';
                return;
            }
            list.innerHTML = filtered.map(function (item) {
                var isTask = item.refType === 'task' && item.refId;
                var action = isTask ? '<button type="button" class="staff-notice-read" data-notification-task="' + escapeHtml(item.refId) + '" data-notification-id="' + escapeHtml(item.id) + '">' +
                    escapeHtml(item.actionLabel || 'Mở nhiệm vụ') + '</button>' : '';
                var readAction = !item.isRead ? '<button type="button" class="staff-notice-read" data-notification-read="' + escapeHtml(item.id) + '">Đánh dấu đã đọc</button>' :
                    '<span class="staff-settings-note">Đã đọc</span>';

        function formatNotificationTime(value) {
            var date = new Date(Number(value) || value);
            return isNaN(date.getTime()) ? '' : date.toLocaleString('vi-VN');
        }

        function updateStaffNotificationCount() {
            var items = RH.getCurrentUserNotifications();
            var count = items.filter(function (item) { return !item.isRead; }).length;
            var badge = document.getElementById('staffNotificationCount');
            if (badge) {
                badge.textContent = count > 99 ? '99+' : String(count);
                badge.hidden = count === 0;
            }
        }

        function syncStaffDueNotifications() {
            var today = todayValue();
            assignedTasks().forEach(function (task) {
                var due = dateValue(task.dueAt || task.scheduledAt);
                if (!due || due > today || ['resolved', 'closed'].indexOf(task.status) !== -1 || task.staffTaskStatus === 'approved') return;
                var overdue = due < today;
                try {
                    var result = RH.createStaffNotificationForEvent(RH_SESSION.id, 'deadline', {
                        eventId: 'task:' + task.id + ':due-reminder:' + due,
                        title: overdue ? 'Nhiệm vụ đã quá hạn' : 'Nhiệm vụ đến hạn hôm nay',
                        body: 'Nhiệm vụ ' + (task.code || task.id) + ': ' + (task.title || 'Nhiệm vụ') + (overdue ? ' đã quá hạn từ ' + due + '.' : ' có hạn xử lý hôm nay.'),
                        refType: 'task',
                        refId: task.id,
                        actionUrl: 'staff.html',
                        actionLabel: 'Mở không gian nhân viên'
                    });
                    if (!result.ok) setStaffSettingsMessage(result.error || 'Không thể lưu nhắc hạn nhiệm vụ.', true);
                } catch (error) {
                    setStaffSettingsMessage(error.message || 'Không thể lưu nhắc hạn nhiệm vụ.', true);
                }
            });
        }

        function wageStatus(wage) {
            if (!wage || !(Number(wage.approvedAmount) > 0) && !(Number(wage.baseAmount) > 0)) return { label: 'Chưa lập tiền công', style: 'waiting' };
            if (wage.status === 'paid') return { label: 'Đã thanh toán', style: 'done' };
            return { label: 'Đã duyệt · Chưa thanh toán', style: 'approval' };
        }

        function compensationDate(task) {
            return dateValue(task.staffCompletedAt || task.resolvedAt || (task.staffWage && task.staffWage.approvedAt) || task.updatedAt || task.createdAt);
        }

        function compensationApproval(expense) {
            var status = String(expense.approvalStatus || expense.materialApprovalStatus || expense.expenseApprovalStatus || expense.status || '').trim().toLocaleLowerCase();
            if (['approved', 'đã duyệt', 'duyet', 'approved_by_manager'].indexOf(status) !== -1) return { key: 'approved', label: 'Đã duyệt', style: 'done' };
            if (['pending', 'pending_approval', 'chờ duyệt', 'đang chờ duyệt', 'waiting'].indexOf(status) !== -1) return { key: 'pending', label: 'Đang chờ duyệt', style: 'waiting' };
            if (['rejected', 'declined', 'bị từ chối', 'từ chối'].indexOf(status) !== -1) return { key: 'rejected', label: 'Bị từ chối', style: 'rejected' };
            return { key: 'unknown', label: 'Chưa có trạng thái duyệt', style: 'approval' };
        }

        function approvedCompensationWage(task) {
            var wage = task.staffWage || {};
            var status = String(wage.status || '').toLocaleLowerCase();
            var managerApproved = status === 'paid' || status === 'unpaid' || status === 'approved' ||
                (!status && (Number(wage.approvedAmount) > 0 || !!wage.approvedAt || !!wage.approvedBy));
            var amount = wageTotal(wage);
            return managerApproved && amount > 0 ? amount : 0;
        }

            return (Number(value) || 0).toLocaleString('vi-VN') + ' ₫';
        }

                console.error('Không thể tải dữ liệu tổng hợp tiền công và chi phí.', error);

                staffContent.innerHTML = '<div class="staff-panel staff-empty" role="alert">Không thể tải dữ liệu tổng hợp. Vui lòng tải lại trang hoặc đăng nhập lại.</div>';

                var amount = Number(record.amount);
                if (!isFinite(amount) || amount < 0) return;
                var quantityValue = Number(record.quantity || record.qty);
                var quantity = isFinite(quantityValue) && quantityValue > 0 ? quantityValue : null;
                var unitPriceValue = Number(record.unitPrice);
                var unitPrice = record.unitPrice != null && isFinite(unitPriceValue) && unitPriceValue >= 0
                    ? unitPriceValue
                    : (quantity ? amount / quantity : null);

                (expensesByTask[task.id] || (expensesByTask[task.id] = [])).push({
                    id: record.id,
                    name: record.materialName || record.itemName || record.description || record.category || 'Chi phí nhiệm vụ',

            var approvedMaterialTotal = filteredExpenses.reduce(function (sum, row) {

            staffContent.innerHTML = '<div class="staff-panel"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;"><div><div style="color:#718096;font-size:12px;">' + escapeHtml(request.code || request.id) + '</div><h2 style="margin:5px 0 0;">' + escapeHtml(request.title || 'Yêu cầu hỗ trợ') + '</h2></div><span class="staff-badge ' + status.style + '">' + escapeHtml(status.label) + '</span></div>' +
                '<div class="staff-detail-grid"><div class="staff-detail-item"><small>Nhóm chuyên môn</small><strong>' + escapeHtml(group ? staffGroupLabels[group] : 'Chưa phân nhóm') + (groupInfo ? '<br><span style="font-size:12px;font-weight:400;color:#61708a;">' + escapeHtml(groupInfo.description) + '</span>' : '') + '</strong></div>' +
                '<div class="staff-detail-item"><small>Loại yêu cầu / mức độ</small><strong>' + escapeHtml(request.category || 'Khác') + ' · ' + escapeHtml(((RHD.SUPPORT_PRIORITIES || []).filter(function (item) { return item.id === request.priority; })[0] || {}).label || 'Bình thường') + '</strong></div>' +

                '<div class="staff-detail-item"><small>Tòa nhà / căn hộ</small><strong>' + escapeHtml(pair.label || request.location || 'Chưa rõ vị trí') + '</strong></div>' +

                '<div class="staff-linked-request"><span>Mã hồ sơ liên kết: ' + escapeHtml(request.code || request.id) + '</span><span>Cư dân: Yêu cầu hỗ trợ</span><span>Quản lý: Hồ sơ yêu cầu</span></div>' +

        function renderStaffPage() {
            if (currentStaffPage === 'Tổng quan') renderOverview();
            else if (currentStaffPage === 'Danh sách nhiệm vụ') renderTaskList();
            else if (currentStaffPage === 'Chi tiết nhiệm vụ') renderTaskDetail(false);
            else if (currentStaffPage === 'Cập nhật tiến độ') renderTaskDetail(true);
            else if (currentStaffPage === 'Tổng hợp tiền công & chi phí' || currentStaffPage === 'Tổng hợp tiền công và chi phí') renderCompensationSummary();
            else if (currentStaffPage === 'Lịch sử tiền công' || currentStaffPage === 'Theo dõi trạng thái tiền công') renderWageHistory();
            else if (currentStaffPage === 'Hồ sơ cá nhân') renderProfile();
            else if (currentStaffPage === 'Cài đặt giao diện') renderAppearanceSettings();
            else if (currentStaffPage === 'Cài đặt thông báo') renderNotificationSettings();
            else staffContent.innerHTML = '<div class="staff-panel"><p>Nội dung sẽ hiển thị tại đây.</p></div>';
        }

        function bindTaskFilters() {
            var controls = [
                ['staffTaskSearch', 'search'], ['staffTaskStatus', 'status'], ['staffTaskDue', 'dueStatus'], ['staffTaskPriority', 'priority'],
                ['staffTaskBuilding', 'building'], ['staffTaskFrom', 'from'], ['staffTaskTo', 'to']
            ];
            controls.forEach(function (pair) {
                var input = document.getElementById(pair[0]);
                if (!input) return;
                input.addEventListener(pair[1] === 'search' ? 'input' : 'change', function () {
                    var focused = document.activeElement && document.activeElement.id === pair[0];
                    var caret = pair[1] === 'search' && focused ? input.selectionStart : null;
                    staffFilters[pair[1]] = input.value.trim();
                    renderTaskList();
                    if (focused) {
                        var restored = document.getElementById(pair[0]);
                        restored.focus();
                        if (caret != null) restored.setSelectionRange(caret, caret);
                    }
                });
            });
        }

        function updateTaskStatus(id, action) {
            var request = assignedTasks().filter(function (task) { return task.id === id; })[0];
            if (!request) {
                alert('Nhiệm vụ không còn được phân công cho tài khoản này.');
                renderStaffPage();
                return;
            }
            var now = Date.now();
            var changes = { updatedAt: now };
            if (action === 'start') {
                if (taskStatus(request).label !== 'Chờ tiếp nhận') return;
                changes.status = 'in_progress';
                changes.staffTaskStatus = 'in_progress';
                changes.startedAt = now;
                changes.acceptedAt = request.acceptedAt || now;
            } else if (action === 'complete') {
                var note = (document.getElementById('staffCompletionNote').value || '').trim();
                if (!note) { alert('Vui lòng nhập báo cáo kết quả trước khi gửi Quản lý duyệt.'); return; }
                if (taskStatus(request).label !== 'Đang xử lý') return;
                changes.staffTaskStatus = 'pending_approval';
                changes.staffCompletionNote = note;
                changes.staffCompletedAt = now;
            }
            var result = RHD.update('supportRequests', request.id, changes);
            if (!result.ok) {
                alert(result.error || 'Không thể cập nhật tiến độ nhiệm vụ.');
                return;
            }
            renderStaffPage();
        }

        staffContent.addEventListener('click', function (event) {
            var pageButton = event.target.closest('[data-staff-page]');
            if (pageButton) { openPage(pageButton.dataset.staffPage); return; }
            var notificationFilterButton = event.target.closest('[data-notification-filter]');
            if (notificationFilterButton) {
                notificationFilter = notificationFilterButton.dataset.notificationFilter;
                renderNotificationSettings();
                return;
            }
            var markAllButton = event.target.closest('[data-notification-mark-all]');
            if (markAllButton) {
                var unreadNotifications = RH.getCurrentUserNotifications().filter(function (item) { return !item.isRead; });
                var markedCount = 0;
                var markError = '';
                unreadNotifications.forEach(function (item) {
                    if (markError) return;
                    var result = RH.markCurrentUserNotificationRead(item.id);
                    if (!result.ok) markError = result.error || 'Không thể cập nhật tất cả thông báo.';
                    else markedCount++;
                });
                staffSettingsMessage = markError
                    ? { text: markedCount ? 'Đã đánh dấu ' + markedCount + ' thông báo; còn một số thông báo chưa cập nhật. ' + markError : markError, error: true }
                    : { text: markedCount ? 'Đã đánh dấu ' + markedCount + ' thông báo là đã đọc.' : 'Không có thông báo chưa đọc.', error: false };
                renderNotificationSettings();
                return;
            }
            var taskNoticeButton = event.target.closest('[data-notification-task]');
            if (taskNoticeButton) {
                var noticeReadResult = RH.markCurrentUserNotificationRead(taskNoticeButton.dataset.notificationId);
                if (!noticeReadResult.ok) setStaffSettingsMessage(noticeReadResult.error || 'Không thể cập nhật thông báo.', true);
                selectedTaskId = taskNoticeButton.dataset.notificationTask;
                openPage(assignedTasks().some(function (task) { return task.id === selectedTaskId; }) ? 'Chi tiết nhiệm vụ' : 'Danh sách nhiệm vụ');
                return;
            }
            var appearanceOption = event.target.closest('[data-appearance-option]');
            if (appearanceOption) {
                appearanceDraft[appearanceOption.dataset.appearanceOption] = appearanceOption.dataset.value;
                staffSettingsMessage = null;
                renderAppearanceSettings();
                var selectedOption = Array.prototype.filter.call(staffContent.querySelectorAll('[data-appearance-option]'), function (option) {
                    return option.dataset.appearanceOption === appearanceOption.dataset.appearanceOption && option.dataset.value === appearanceOption.dataset.value;
                })[0];
                if (selectedOption) selectedOption.focus();
                return;
            }
            var appearanceDevice = event.target.closest('[data-appearance-device]');
            if (appearanceDevice) {
                appearancePreviewDevice = appearanceDevice.dataset.appearanceDevice;
                renderAppearanceSettings();
                var selectedDevice = staffContent.querySelector('[data-appearance-device="' + appearancePreviewDevice + '"]');
                if (selectedDevice) selectedDevice.focus();
                return;
            }
            var appearanceAction = event.target.closest('[data-appearance-action]');
            if (appearanceAction) {
                var appearanceActionName = appearanceAction.dataset.appearanceAction;
                if (appearanceActionName === 'reset') {
                    appearanceDraft = { theme: 'system', density: 'comfortable', fontSize: 'medium', accentColor: 'blue' };
                    staffSettingsMessage = { text: 'Đã khôi phục mặc định. Nhấn Lưu cài đặt để áp dụng.', error: false };
                    renderAppearanceSettings();
                    return;
                }
                if (appearanceActionName === 'cancel') {
                    var savedAppearance = RH.getCurrentUserSettings();
                    appearanceDraft = { theme: savedAppearance.theme, density: savedAppearance.density, fontSize: savedAppearance.fontSize, accentColor: savedAppearance.accentColor };
                    staffSettingsMessage = { text: 'Đã hủy các thay đổi chưa lưu.', error: false };
                    renderAppearanceSettings();
                    return;
                }
                if (appearanceActionName === 'save') {
                    var savedResult = RH.updateCurrentUserSettings({
                        theme: appearanceDraft.theme,
                        density: appearanceDraft.density,
                        fontSize: appearanceDraft.fontSize,
                        accentColor: appearanceDraft.accentColor
                    });
                    if (!savedResult.ok) {
                        staffSettingsMessage = { text: savedResult.error || 'Không thể lưu cài đặt giao diện.', error: true };
                        renderAppearanceSettings();
                        return;
                    }
                    appearanceDraft = { theme: savedResult.preferences.theme, density: savedResult.preferences.density, fontSize: savedResult.preferences.fontSize, accentColor: savedResult.preferences.accentColor };
                    document.body.classList.toggle('staff-density-compact', savedResult.preferences.density === 'compact');
                    staffSettingsMessage = { text: 'Cài đặt giao diện đã được lưu và áp dụng.', error: false };
                    renderAppearanceSettings();
                    return;
                }
            }
            var profileTabButton = event.target.closest('[data-profile-tab]');
            if (profileTabButton) {
                profileTab = profileTabButton.dataset.profileTab;
                renderProfile();
                return;
            }
            var profileTaskFilter = event.target.closest('[data-profile-task-filter]');
            if (profileTaskFilter) {
                var filter = profileTaskFilter.dataset.profileTaskFilter;
                staffFilters.search = '';
                staffFilters.priority = 'all';
                staffFilters.building = 'all';
                staffFilters.from = '';
                staffFilters.to = '';
                staffFilters.status = filter === 'pending' ? 'Chờ tiếp nhận' :
                    (filter === 'progress' ? 'Đang xử lý' : (filter === 'completed' ? 'completed' : 'all'));
                staffFilters.dueStatus = filter === 'overdue' ? 'overdue' : 'all';
                openPage('Danh sách nhiệm vụ');
                return;
            }
            if (event.target.closest('[data-profile-refresh]')) {
                profileEditing = false;
                profileDraftAvatar = '';
                profileFieldErrors = {};
                staffSettingsMessage = null;
                renderProfile();
                return;
            }
            if (event.target.closest('[data-profile-edit]')) {
                profileEditing = true;
                profileTab = 'personal';
                profileFieldErrors = {};
                staffSettingsMessage = null;
                renderProfile();
                return;
            }
            if (event.target.closest('[data-profile-cancel]')) {
                profileEditing = false;
                profileDraftAvatar = '';
                profileFieldErrors = {};
                staffSettingsMessage = null;
                renderProfile();
                return;
            }
            var readButton = event.target.closest('[data-notification-read]');
            if (readButton) {
                var readResult = RH.markCurrentUserNotificationRead(readButton.dataset.notificationRead);
                if (!readResult.ok) setStaffSettingsMessage(readResult.error || 'Không thể cập nhật thông báo.', true);
                else staffSettingsMessage = { text: 'Đã đánh dấu thông báo là đã đọc.', error: false };
                renderNotificationSettings();
                return;
            }
            var taskButton = event.target.closest('[data-open-task]');
            if (taskButton) {
                selectedTaskId = taskButton.dataset.openTask;
                openPage('Chi tiết nhiệm vụ');
                return;
            }
            var actionButton = event.target.closest('[data-task-action]');
            if (actionButton) updateTaskStatus(actionButton.dataset.taskId, actionButton.dataset.taskAction);
        });
        staffContent.addEventListener('submit', function (event) {
            if (event.target.id !== 'staffProfileForm') return;
            event.preventDefault();
            var emailInput = document.getElementById('staffProfileEmail');
            var phoneInput = document.getElementById('staffProfilePhone');
            var email = emailInput.value.trim();
            var phone = phoneInput.value.trim();
            profileFieldErrors = {
                email: profileFieldError('email', email),
                phone: profileFieldError('phone', phone)
            };
            setProfileFieldError('email', profileFieldErrors.email);
            setProfileFieldError('phone', profileFieldErrors.phone);
            var invalidField = profileFieldErrors.email ? emailInput : (profileFieldErrors.phone ? phoneInput : null);
            if (invalidField) {
                invalidField.focus();
                return;
            }
            var saveButton = document.getElementById('staffProfileSave');
            if (saveButton) { saveButton.disabled = true; saveButton.textContent = 'Đang lưu...'; }
            var result = RH.updateCurrentUserProfile({
                phone: phone,
                email: email,
                avatar: profileDraftAvatar
            });
            if (!result.ok) {
                setStaffSettingsMessage(result.error || 'Không thể lưu hồ sơ.', true);
                if (saveButton) { saveButton.disabled = false; saveButton.textContent = 'Lưu thay đổi'; }
                return;
            }
            profileEditing = false;
            profileFieldErrors = {};
            profileDraftAvatar = result.user.avatar || '';
            staffSettingsMessage = { text: 'Hồ sơ đã được cập nhật.', error: false };
            renderProfile();
        });
        staffContent.addEventListener('input', function (event) {
            if (event.target.id === 'staffNotificationSearch') {
                notificationSearch = event.target.value;
                renderNotificationList(RH.getCurrentUserNotifications().slice().sort(function (a, b) {
                    return Number(b.createdAt || 0) - Number(a.createdAt || 0);
                }));
                return;
            }
            var field = event.target.id === 'staffProfileEmail' ? 'email' : (event.target.id === 'staffProfilePhone' ? 'phone' : '');
            if (!field || !profileFieldErrors[field]) return;
            setProfileFieldError(field, profileFieldError(field, event.target.value.trim()));
        });
        staffContent.addEventListener('change', function (event) {
            var target = event.target;
            if (target.id === 'staffActivityFrom' || target.id === 'staffActivityTo' ||
                target.id === 'staffActivityStatus' || target.id === 'staffActivityType') {
                var activityFilterKey = {
                    staffActivityFrom: 'from',
                    staffActivityTo: 'to',
                    staffActivityStatus: 'status',
                    staffActivityType: 'type'
                }[target.id];
                profileActivityFilters[activityFilterKey] = target.value;
                renderProfile();
                return;
            }
            if (target.id === 'staffAvatarFile') {
                var file = target.files && target.files[0];
                if (!file) return;
                if (!/^image\/(png|jpeg|webp)$/.test(file.type) || file.size > 2 * 1024 * 1024) {
                    setStaffSettingsMessage('Chọn ảnh PNG, JPEG hoặc WebP có dung lượng tối đa 2 MB.', true);
                    target.value = '';
                    return;
                }
                var reader = new FileReader();
                reader.onload = function () {
                    profileDraftAvatar = String(reader.result || '');
                    var preview = document.getElementById('staffAvatarPreview');
                    if (preview) preview.innerHTML = '<img src="' + escapeHtml(profileDraftAvatar) + '" alt="Ảnh đại diện xem trước">';
                    setStaffSettingsMessage('Ảnh xem trước đã sẵn sàng. Nhấn Lưu thay đổi để áp dụng.', false);
                };
                reader.onerror = function () { setStaffSettingsMessage('Không thể đọc tệp ảnh đã chọn.', true); };
                reader.readAsDataURL(file);
                return;
            }
            var category = target.dataset.notificationCategory;
            var channel = target.dataset.notificationChannel;
            if (category || channel) {
                var notificationPatch = { notifications: { categories: {}, channels: {} } };
                if (category) notificationPatch.notifications.categories[category] = target.checked;
                if (channel) notificationPatch.notifications.channels[channel] = target.checked;
                target.disabled = true;
                try {
                    var notificationResult = RH.updateCurrentUserSettings(notificationPatch);
                    if (!notificationResult.ok) {
                        target.checked = !target.checked;
                        setStaffSettingsMessage(notificationResult.error || 'Không thể lưu tùy chọn thông báo.', true);
                    } else {
                        setStaffSettingsMessage('Tùy chọn thông báo đã được lưu.', false);
                        updateStaffNotificationCount();
                        if (category === 'deadline' && target.checked) syncStaffDueNotifications();
                    }
                } catch (error) {
                    target.checked = !target.checked;
                    setStaffSettingsMessage(error.message || 'Không thể lưu tùy chọn thông báo.', true);
                } finally {
                    target.disabled = false;
                }
            }
        });
        menuItems.forEach(function (item) {
            item.addEventListener('click', function () { openPage(item.dataset.title); });
        });
        document.getElementById('staffNotificationLink').addEventListener('click', function () {
            openPage('Cài đặt thông báo');
        });
        window.addEventListener('residenthub:business-data-changed', function (event) {
            if (!event.detail || event.detail.entity === 'supportRequests' || event.detail.entity === 'cashflows') renderStaffPage();
        });
        window.addEventListener('residenthub:data-changed', function () {
            updateStaffNotificationCount();
            if (currentStaffPage === 'Cài đặt thông báo') renderNotificationSettings();
        });
        window.addEventListener('residenthub:user-updated', function () {
            if (currentStaffPage === 'Hồ sơ cá nhân') renderProfile();
        });
        window.addEventListener('residenthub:preferences-changed', function () {
            if (window.RHTheme) window.RHTheme.apply();
            if (currentStaffPage === 'Cài đặt giao diện') appearanceDraft = null;
            if (currentStaffPage === 'Cài đặt giao diện' || currentStaffPage === 'Cài đặt thông báo') renderStaffPage();
        });
        window.addEventListener('storage', function (event) {
            if (event.key === 'residenthub_live_supportRequests' || event.key === 'residenthub_live_cashflows') renderStaffPage();
            if (event.key === 'residenthub_users' || event.key === 'residenthub_internal_data') {
                updateStaffNotificationCount();
                if (currentStaffPage === 'Cài đặt giao diện') appearanceDraft = null;
                if (currentStaffPage === 'Hồ sơ cá nhân' || currentStaffPage === 'Cài đặt giao diện' || currentStaffPage === 'Cài đặt thông báo') renderStaffPage();
            }
        });
        document.getElementById('staffUserName').textContent = (RH_SESSION.name || '') + (staffGroupLabels[RH_SESSION.staffGroup] ? ' · ' + staffGroupLabels[RH_SESSION.staffGroup] : '');
        var currentPreferences = RH.getCurrentUserSettings();
        document.body.classList.toggle('staff-density-compact', currentPreferences.density === 'compact');
        updateStaffNotificationCount();
        syncStaffDueNotifications();
        window.setInterval(syncStaffDueNotifications, 60000);
        renderStaffPage();
        document.getElementById('staffMenuToggle').addEventListener('click', function () {
            document.getElementById('staffSidebar').classList.toggle('open');
        });
        document.getElementById('staffLogout').addEventListener('click', function () {
            RH.logout();
            window.location.replace('index.html');
        });
    </script>
</body>
</html>
